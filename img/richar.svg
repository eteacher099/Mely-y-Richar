      <rect x="30" y="180" width="160" height="130" fill="#fdfbf5"/>
      <g fill="#223a70">
        <rect x="30" y="206" width="160" height="10"/><rect x="30" y="228" width="160" height="10"/>
        <rect x="30" y="250" width="160" height="10"/><rect x="30" y="272" width="160" height="10"/>
        <rect x="30" y="294" width="160" height="10"/>
      </g>
    </g>
    <path fill="none" d="M44 236c0-30 26-48 66-48s66 18 66 48l4 70H40Z"/>
