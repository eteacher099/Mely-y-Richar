      <!-- mejillas -->
      <ellipse cx="-38" cy="16" rx="11" ry="6" fill="#e07f6f" fill-opacity=".3" stroke="none"/>
      <ellipse cx="38" cy="16" rx="11" ry="6" fill="#e07f6f" fill-opacity=".3" stroke="none"/>
