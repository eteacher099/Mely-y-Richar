    <path fill="#fdfbf5" d="M46 214c-10 6-16 16-18 30l22 6 6-24Z"/>
    <path fill="#fdfbf5" d="M174 214c10 6 16 16 18 30l-22 6-6-24Z"/>
    <path fill="none" stroke="#223a70" stroke-width="5" d="M30 238l20 5M190 238l-20 5"/>
    <!-- cuello -->
    <path fill="url(#rSkin)" d="M94 168v24c8 8 24 8 32 0v-24Z"/>
    <path fill="#fdfbf5" d="M88 190c8 10 36 10 44 0l6 4c-10 14-46 14-56 0Z"/>

    </g>

    <!-- ===== cabeza (misma que en couple.svg) ===== -->
    <g transform="translate(110 104)">
      <!-- orejas -->
      <ellipse cx="-63" cy="4" rx="10" ry="16" fill="#dc9a83"/>
      <ellipse cx="63" cy="4" rx="10" ry="16" fill="#dc9a83"/>
