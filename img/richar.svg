    <path fill="url(#rSkin)" d="M70 330h28v40H72ZM122 330h28l-2 40h-26Z"/>
    <path fill="#e6d3ac" d="M58 296h104l-4 44h-40l-8-14-8 14H62Z"/>
    <path fill="none" stroke="#c7b07f" d="M110 300v26"/>
    <!-- tenis -->
    <path fill="#fff" d="M66 368h34c4 0 6 4 6 8v6H62v-6c0-5 1-8 4-8Z"/>
    <path fill="#fff" d="M120 368h34c3 0 4 3 4 8v6h-44v-6c0-4 2-8 6-8Z"/>
    <path fill="none" stroke="#2a4d93" stroke-width="3" d="M66 376h36M118 376h36"/>

    <!-- brazos -->
    <path fill="url(#rSkin)" d="M44 230c-14 18-18 46-16 72 1 8 16 9 18 1 2-22 6-42 14-56Z"/>
    <path fill="url(#rSkin)" d="M176 230c14 18 18 46 16 72-1 8-16 9-18 1-2-22-6-42-14-56Z"/>

