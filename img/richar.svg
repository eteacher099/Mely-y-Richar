<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 400">
  <title>Richar</title>
  <defs>
    <radialGradient id="rSkin" cx=".45" cy=".38" r=".75">
      <stop offset="0" stop-color="#f1c3ae"/><stop offset="1" stop-color="#d9957f"/>
    </radialGradient>
    <radialGradient id="rHair" cx=".5" cy=".15" r=".85">
      <stop offset="0" stop-color="#4a3f3b"/><stop offset=".6" stop-color="#5f5450"/><stop offset="1" stop-color="#9a918c"/>
    </radialGradient>
    <linearGradient id="rTemple" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c837e"/><stop offset="1" stop-color="#bdb5b0"/>
    </linearGradient>
    <clipPath id="rShirt"><path d="M44 236c0-30 26-48 66-48s66 18 66 48l4 70H40Z"/></clipPath>
  </defs>

  <ellipse cx="110" cy="390" rx="62" ry="8" fill="#000" fill-opacity=".12"/>

  <g stroke="#3a2418" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
