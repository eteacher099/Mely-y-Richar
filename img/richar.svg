      <path fill="#2b1a12" d="M-36-6c4-7 18-7 22 0-5 5-17 5-22 0Z"/>
      <path fill="#2b1a12" d="M14-6c4-7 18-7 22 0-5 5-17 5-22 0Z"/>
      <circle cx="-22" cy="-7" r="1.8" fill="#fff" stroke="none"/>
      <circle cx="28" cy="-7" r="1.8" fill="#fff" stroke="none"/>
      <path fill="none" stroke="#b46f5b" stroke-width="1.6" d="M-36 2q11 5 22 0M14 2q11 5 22 0"/>
      <!-- cejas gruesas -->
      <path fill="#2f1d15" d="M-44-20c8-9 26-11 34-5l-1 6c-9-4-22-3-31 4Z"/>
      <path fill="#2f1d15" d="M44-20c-8-9-26-11-34-5l1 6c9-4 22-3 31 4Z"/>
      <!-- pelo: peinado hacia atrás con volumen, sal y pimienta arriba, canas en los costados -->
      <path fill="url(#rHair)" d="M-60-10c-10-40 8-80 50-88 40-8 74 12 78 44 2 16-1 30-6 44-2-14-6-24-12-30-12-10-34-14-56-14-22 0-40 8-48 18-4 6-6 14-6 26Z"/>
      <path fill="url(#rTemple)" stroke="none" d="M-61-4c-4-18 0-32 9-40 4 6 6 10 6 14-5 6-8 14-9 24Z"/>
      <path fill="url(#rTemple)" stroke="none" d="M61-2c3-16 2-30-5-40-4 6-6 10-6 14 4 6 7 14 7 24Z"/>
      <g fill="none" stroke="#c9c1bc" stroke-width="2.6" opacity=".9">
        <path d="M-32-62c18-22 54-30 82-12M-44-46c20-18 58-22 92-6M-18-80c16-8 38-8 54 2"/>
      </g>
      <g fill="none" stroke="#1d1613" stroke-width="1.8" opacity=".55">
        <path d="M-22-54c14-16 40-22 66-12M-10-70c14-8 34-8 50 0"/>
      </g>
      <path fill="none" stroke="#2a221f" stroke-width="1.6" opacity=".6" d="M-34-48c6-14 14-26 26-34"/>
